---
deployment:
  tasks:
    # Production and staging are separate cPanel clones of this repo; the branch
    # each one has checked out decides where it deploys: main -> production,
    # anything else -> staging.
    - export DEPLOYBRANCH=$(git rev-parse --abbrev-ref HEAD)
    - 'if [ "$DEPLOYBRANCH" = "main" ]; then export DEPLOYPATH=/home/hcispanel/kpn-coi; else export DEPLOYPATH=/home/hcispanel/kpn-coi-stage; fi'
    - echo "Deploying branch $DEPLOYBRANCH to $DEPLOYPATH"

    # Copy essential Laravel application directories to deployment path
    - /bin/cp -r app bootstrap config database routes resources $DEPLOYPATH

    - /bin/cp -r public/build $DEPLOYPATH/public

    # Copy public assets to the public_html directory
    # - /bin/cp -r public/css public/img public/images public/js public/scss /home/hcispanel/public_html/commitment-corner.hcis.live

    # Change directory to the deployment path
    - cd $DEPLOYPATH

    # Install production dependencies using Composer
    # - composer install --no-dev --optimize-autoloader

    # Run database migrations (for first deployment)
    # - php artisan migrate --force

    # Clear Laravel application cache
    - php artisan optimize:clear

    # Tell running queue workers to restart so they pick up the new code
    - php artisan queue:restart

